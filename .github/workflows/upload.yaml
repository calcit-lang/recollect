name: Upload

on:
  push:
    branches:
      - main
      - wasm-support
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref == 'refs/heads/main' && 'production' || format('branch-{0}', github.ref_name) }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - uses: dtolnay/rust-toolchain@stable

    - name: "deps"
      run: caps --strict --ci && yarn install --immutable && caps verify --toolchain

    - name: "validate snapshot and types"
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru --entry test --check-only
        calcit calcit.cirru fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
        calcit calcit.cirru analyze weak-types --only coverage --summary-only --format json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format json
        calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru --entry test --check-only --ns recollect.diff --ns recollect.memo --ns recollect.patch --ns recollect.schema --ns recollect.twig --ns recollect.util --format edn
        calcit calcit.cirru analyze check-examples --ns recollect.diff
        calcit calcit.cirru analyze check-examples --ns recollect.patch
        calcit calcit.cirru analyze check-examples --ns recollect.twig
        calcit calcit.cirru analyze check-examples --ns recollect.util
        calcit docs check-md README.md --dep ./ --failures-only
        calcit docs check-md docs/validated-patch.md --dep ./ --failures-only

    - name: "calcit test"
      run: |
        set -euo pipefail
        yarn test:calcit
        calcit calcit.cirru --entry test

    - name: "js tests"
      run: >
        calcit calcit.cirru --entry test js && env=ci node test.mjs

    - name: Load released definition-test runner
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      with:
        repository: calcit-lang/calcit
        ref: 0.31.0
        path: .calcit/core-test-tools
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /scripts/run-core-tests.mjs
          /scripts/core-test-protocol.mjs
          /scripts/core-tests-exclusions.cirru
          /docs/installation/wasm-support.md

    - name: Replay shared contracts and JavaScript-only display contracts
      run: |
        set -euo pipefail
        CALCIT_BIN="$(command -v calcit)"
        export CALCIT_BIN
        node .calcit/core-test-tools/scripts/run-core-tests.mjs \
          --snapshot calcit.cirru --entry default --backend native,js --exclude-tag app-js \
          --exclusions .calcit/core-test-tools/scripts/core-tests-exclusions.cirru \
          --support-matrix .calcit/core-test-tools/docs/installation/wasm-support.md
        node .calcit/core-test-tools/scripts/run-core-tests.mjs \
          --snapshot calcit.cirru --entry default --backend js --tag app-js \
          --exclusions .calcit/core-test-tools/scripts/core-tests-exclusions.cirru \
          --support-matrix .calcit/core-test-tools/docs/installation/wasm-support.md

    - name: "WASM eligibility check"
      continue-on-error: true
      run: calcit wasm calcit.cirru --entry test --check-only

    - name: Build client with CDN asset URLs
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
        calcit calcit.cirru js
        yarn vite build --base="$VITE_BASE_URL"

    - name: Upload static assets to COS
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
