name: Upload

on:
  push:
    branches:
      - main
      - wasm-support
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - uses: dtolnay/rust-toolchain@stable

    # respo-value still requests an earlier Respo release, so strict Caps
    # resolution would reject the otherwise compatible highest SemVer set.
    - name: "deps"
      run: caps --ci && yarn install --immutable && caps verify --toolchain

    - name: "validate snapshot and types"
      run: |
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-types --summary-only --format json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,code-dynamic --intent unresolved --summary-only --format json
        calcit calcit.cirru analyze deprecated --summary-only --format json
        calcit calcit.cirru analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru analyze check-public --ns recollect.diff --ns recollect.memo --ns recollect.patch --ns recollect.schema --ns recollect.twig --ns recollect.util --summary-only
        calcit calcit.cirru analyze check-examples --ns recollect.diff
        calcit calcit.cirru analyze check-examples --ns recollect.patch
        calcit calcit.cirru analyze check-examples --ns recollect.twig
        calcit calcit.cirru analyze check-examples --ns recollect.util
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: "calcit test"
      run: calcit calcit.cirru --entry test

    - name: "js tests"
      run: >
        calcit calcit.cirru --entry test js && env=ci node test.mjs

    - name: "WASM eligibility check"
      continue-on-error: true
      run: calcit wasm calcit.cirru --entry test --check-only

    - name: Build client with CDN asset URLs
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
        calcit calcit.cirru js
        yarn vite build --base="$VITE_BASE_URL"

    - name: Upload static assets to COS
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: worktools/cos-upload-action@17e6d213fe9f6772a6090a13c8ba044cd6cbcb09 # v1.1.1
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
